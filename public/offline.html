<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiscootto – offline</title>
    <style>
      :root { color-scheme: dark; --bg: #070a09; --fg: #eef4f1; --muted: #a9b7b1; --accent: #3ee0a0; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(800px 400px at 50% -120px, rgb(30 140 100 / 0.35), transparent 70%), var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: var(--muted); max-width: 32ch; margin: 0 auto 20px; }
      button { font: inherit; border: 0; border-radius: 10px; padding: 10px 18px; background: var(--accent); color: #04140d; font-weight: 600; box-shadow: 0 0 22px rgb(62 224 160 / 0.3); cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sei offline</h1>
      <p>Fiscootto ha bisogno della connessione per mostrare i tuoi dati, che per sicurezza non vengono salvati sul dispositivo.</p>
      <button onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
